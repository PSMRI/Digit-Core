version: '3.9'

services:
  kafka-1:
    image: apache/kafka:latest
    hostname: kafka-1
    container_name: kafka-1
    ports:
      - 9092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      # KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
  postgres:
    image: postgres:latest
    container_name: my-postgres
    depends_on:
      - kafka-1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: DIGITDB
    ports:
      - "5432:5432"  # Exposing port 5432 for database access
    volumes:
      - pg_data:/var/lib/postgresql/data  # Persisting data
    networks:
      - mynetwork
    restart: always  # Restart policy in case the container stops unexpectedly
  
  egov-otp:
    build:
      context: ./egov-otp
      args:
        APP_PORT: ${EGOV_OTP_PORT} 
    depends_on:
      - postgres    
    ports:
      - "${EGOV_OTP_PORT}:${EGOV_OTP_PORT}"
    # environment:
    #   - APP_ENV=production
  egov-accesscontrol:
    build:
      context: ./egov-accesscontrol
      args:
        APP_PORT: ${EGOV_ACCESSCONTROL_PORT} 
    depends_on:
      - egov-otp
    ports:
      - "${EGOV_ACCESSCONTROL_PORT}:${EGOV_ACCESSCONTROL_PORT}"
  egov-filestore:
    build:
      context: ./egov-filestore
      args:
        APP_PORT: ${EGOV_FILESTORE_PORT} 
    depends_on:
      - egov-accesscontrol
    ports:
      - "${EGOV_FILESTORE_PORT}:${EGOV_FILESTORE_PORT}"
  egov-mdms-service:
    build:
      context: ./egov-mdms-service
      args:
        APP_PORT: ${EGOV_MDMS_SERVICE_PORT} 
    depends_on:
      - egov-filestore
    volumes:
      - ${MDMS_DATA_FOLDER}:/app/data
    environment:
      - egov.mdms.conf.path=/app/data
    ports:
      - "${EGOV_MDMS_SERVICE_PORT}:${EGOV_MDMS_SERVICE_PORT}"
  egov-enc-service:
    build:
      context: ./egov-enc-service
      args:
        APP_PORT: ${EGOV_ENC_SERVICE_PORT} 
    depends_on:
      - egov-mdms-service
    ports:
      - "${EGOV_ENC_SERVICE_PORT}:${EGOV_ENC_SERVICE_PORT}"
  egov-localization:
    build:
      context: ./egov-localization
      args:
        APP_PORT: ${EGOV_LOCALIZATION_PORT} 
    depends_on:
      - egov-enc-service
    ports:
      - "${EGOV_LOCALIZATION_PORT}:${EGOV_LOCALIZATION_PORT}"
  egov-user:
    build:
      context: ./egov-user
      args:
        APP_PORT: ${EGOV_USER_PORT} 
    depends_on:
      - egov-localization
    ports:
      - "${EGOV_USER_PORT}:${EGOV_USER_PORT}"

# Named volume for persisting PostgreSQL data
volumes:
  pg_data:

# Networks (optional if you plan to connect this container to other containers)
networks:
  mynetwork:
    driver: bridge